org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Gecko (Firefox engine) adds hundreds of MB of native code and can make the first install fail or stall.
# Keep it off until the app installs and runs; then set this to true (or delete the line) and sync.
hydrogen.gecko=false
