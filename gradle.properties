org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Gecko (Firefox engine) is included so the Chromium/Gecko switch works. It adds a lot of native code to the APK;
# if an install ever fails or stalls, set this to false and sync (the switch then offers Chromium only).
hydrogen.gecko=true
