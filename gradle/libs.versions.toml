# Versions checked against Android Developers docs (Nov 2026):
#  - Compose 1.12 (BOM 2026.08/2026.09) needs compileSdk 37 + AGP 9.1.1+
#  - AGP 9.1 needs Gradle 9.3.1+, has built-in Kotlin (no kotlin-android plugin)
#  - Material 3 1.5.x carries Material 3 Expressive
# If Gradle cannot resolve a version below, accept Android Studio's suggested nearest release.
[versions]
agp = "9.1.1"
kotlin = "2.4.0"
composeBom = "2026.09.00"
material3 = "1.5.0-rc01"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
webkit = "1.14.0"
serialization = "1.9.0"
coroutines = "1.10.2"
coreKtx = "1.18.0"
junit = "4.13.2"
biometric = "1.1.0"
pdfbox = "2.0.27.0"
# GeckoView releases are numbered MAJOR.MINOR.BUILDID; "+" takes the newest on maven.mozilla.org. After the first successful sync, pin the exact version Gradle resolved.
geckoview = "+"
credentials = "1.5.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
geckoview = { module = "org.mozilla.geckoview:geckoview", version.ref = "geckoview" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
